# GatewayOpLock — standalone Worker configuration
# Phase 1.0.1D.2.5 — this is the exact Worker needed to provide the atomic,
# durable GATEWAY_OP_LOCK binding required by functions/api/gateway/transfer.js.
#
# Deploy from THIS directory once authenticated:
#   npx wrangler deploy
#
# After deploy, bind it in Cloudflare Pages (Preview + Production):
#   Pages → Settings → Functions → Durable Object bindings → GATEWAY_OP_LOCK
#   → the namespace created by this Worker.
# Also set DO_INTERNAL_SECRET (same value in Worker and Pages) in the environment.

name = "elligentt-gateway-op-lock"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Durable Object binding + migration ────────────────────────────────────────
[[durable_objects.bindings]]
name = "GATEWAY_OP_LOCK"
class_name = "GatewayOpLock"

[[migrations]]
tag = "v1"
new_classes = ["GatewayOpLock"]
